<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NodePulse Enterprise Fleet</title>
    <style>
        :root {
            --bg: #090d13;
            --surface: #111722;
            --border: #212d3d;
            --text-dim: #7d8b99;
            --text: #c5d1de;
            --text-bright: #ffffff;
            --blue: #388bfd;
            --green: #238636;
            --red: #da3633;
            --orange: #d29922;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1rem; min-height: 100vh; }
        
        header { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        @media (min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; padding: 1.5rem 0 1rem; }
            body { padding: 1.5rem 2rem; }
        }
        
        .logo-area { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 34px; height: 34px; min-width: 34px; background: linear-gradient(135deg, #1f6feb, #58a6ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; color: #fff; box-shadow: 0 0 12px rgba(56, 139, 253, 0.4); }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); letter-spacing: -0.5px; }
        
        .stats-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .badge { background: var(--surface); border: 1px solid var(--border); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); }
        .badge b { color: var(--text-bright); }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.25rem; }
        }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; position: relative; overflow: hidden; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.75rem; }
        .node-name { font-size: 1.05rem; font-weight: 600; color: var(--text-bright); word-break: break-all; }
        .node-meta { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); margin-top: 2px; }
        
        .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; font-family: var(--font-mono); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
        .pill-online { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); }
        .pill-warning { background: rgba(210, 153, 34, 0.15); color: #e3b341; border: 1px solid rgba(210, 153, 34, 0.3); }
        .pill-offline { background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.3); }
        .pulse-circle { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .pill-online .pulse-circle { box-shadow: 0 0 6px #3fb950; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.75rem; }
        .metric-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.6rem; min-width: 0; }
        .metric-label { font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .metric-value { font-size: 1rem; font-weight: 700; color: var(--text-bright); font-family: var(--font-mono); }
        .metric-sub { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sparkline { width: 100%; height: 28px; stroke: var(--blue); stroke-width: 1.5; fill: rgba(56, 139, 253, 0.08); display: block; margin-top: 4px; }

        .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); font-weight: 700; margin: 0.75rem 0 0.4rem; display: flex; justify-content: space-between; }
        .service-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
        .service-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font-size: 0.75rem; font-family: var(--font-mono); gap: 0.5rem; }
        .service-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
        .tag-active { color: #3fb950; font-weight: 600; font-size: 0.68rem; white-space: nowrap; flex-shrink: 0; }
        .tag-down { color: #f85149; font-weight: 600; font-size: 0.68rem; white-space: nowrap; flex-shrink: 0; }
        .docker-badge { background: #0087ff22; color: #58a6ff; font-size: 0.65rem; padding: 1px 3px; border-radius: 3px; margin-right: 3px; }

        footer { margin-top: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>NodePulse Enterprise</h1>
                <div style="font-size: 0.75rem; color: var(--text-dim)">Autonomous Fleet Control</div>
            </div>
        </div>
        <div class="stats-bar">
            <div class="badge">Nodes: <b id="total-nodes">0</b></div>
            <div class="badge">Sync: <b id="live-time">...</b></div>
        </div>
    </header>

    <div class="grid" id="nodes-grid"></div>

    <footer>
        NodePulse Platform Engine v0.3.1 • NQAI
    </footer>

    <script>
        function renderSparkline(history, key) {
            if (!history || history.length < 2) return '';
            const values = history.map(h => h[key] || 0);
            const min = Math.min(...values);
            const max = Math.max(...values) || 1;
            const range = (max - min) || 1;
            const w = 140, h = 26;
            const step = w / (values.length - 1);
            
            const points = values.map((v, i) => {
                const x = (i * step).toFixed(1);
                const y = (h - ((v - min) / range) * (h - 4) - 2).toFixed(1);
                return `${x},${y}`;
            }).join(' ');

            return `
                <svg class="sparkline" viewBox="0 0 ${w} ${h}">
                    <polyline fill="none" points="${points}" />
                </svg>
            `;
        }

        async function fetchNodes() {
            try {
                const res = await fetch('/api/v1/nodes');
                const nodes = await res.json();
                render(nodes);
            } catch (err) {
                console.error(err);
            }
        }

        function render(nodes) {
            const grid = document.getElementById('nodes-grid');
            const nodeEntries = Object.entries(nodes);
            document.getElementById('total-nodes').innerText = nodeEntries.length;
            document.getElementById('live-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

            grid.innerHTML = '';
            for (const [id, node] of nodeEntries) {
                const latest = node.latest || {};
                const cpu = latest.cpu || {};
                const mem = latest.memory || {};
                const disk = (latest.disks && latest.disks[0]) || {};
                const services = latest.services || [];
                const history = node.history || [];

                const card = document.createElement('div');
                card.className = 'card';

                let servicesHtml = '<div style="font-size: 0.72rem; color: #6e7681;">No active service probes</div>';
                if (services.length > 0) {
                    servicesHtml = services.slice(0, 10).map(s => `
                        <div class="service-item">
                            <span class="service-name">
                                <span class="docker-badge">${s.type}</span>
                                ${s.name}
                            </span>
                            <span class="${s.active ? 'tag-active' : 'tag-down'}">
                                ${s.active ? '● RUN' : '■ OFF'}
                            </span>
                        </div>
                    `).join('');
                }

                card.innerHTML = `
                    <div class="card-top">
                        <div style="min-width: 0; flex: 1;">
                            <div class="node-name">${id}</div>
                            <div class="node-meta">${node.info.hostname || id} • ${node.info.arch} • ${cpu.cores || 1} CPU</div>
                        </div>
                        <div class="status-pill pill-${node.status}">
                            <span class="pulse-circle"></span>
                            ${node.status}
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="metric-label">
                                <span>Load Avg</span>
                                <span style="color: var(--blue)">1m/5m</span>
                            </div>
                            <div class="metric-value">${(cpu.load_1 || 0).toFixed(2)}</div>
                            <div class="metric-sub">${(cpu.load_5 || 0).toFixed(2)} / ${(cpu.load_15 || 0).toFixed(2)}</div>
                            ${renderSparkline(history, 'load1')}
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">
                                <span>RAM</span>
                                <span>${(mem.used_pct || 0).toFixed(1)}%</span>
                            </div>
                            <div class="metric-value">${((mem.used_bytes || 0) / (1024**3)).toFixed(1)} GB</div>
                            <div class="metric-sub">of ${((mem.total_bytes || 0) / (1024**3)).toFixed(1)} GB</div>
                            ${renderSparkline(history, 'mem_pct')}
                        </div>
                    </div>

                    <div class="section-title">
                        <span>Containers (${services.length})</span>
                        <span>Docker</span>
                    </div>
                    <div class="service-list">
                        ${servicesHtml}
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        fetchNodes();
        setInterval(fetchNodes, 3000);
    </script>
</body>
</html>
