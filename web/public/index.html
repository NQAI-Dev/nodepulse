<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NodePulse Cloud | Distributed Fleet Monitoring</title>
    <style>
        :root {
            --bg: #090d13;
            --surface: #111722;
            --surface-elevated: #161f2e;
            --border: #212d3d;
            --text-dim: #7d8b99;
            --text: #c5d1de;
            --text-bright: #ffffff;
            --blue: #388bfd;
            --blue-glow: rgba(56, 139, 253, 0.25);
            --green: #2ea043;
            --red: #da3633;
            --orange: #d29922;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1rem; min-height: 100vh; }
        @media (min-width: 768px) { body { padding: 1.5rem 2rem; } }

        header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        @media (min-width: 650px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand-icon { width: 36px; height: 36px; min-width: 36px; background: linear-gradient(135deg, #1f6feb, #58a6ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; color: #fff; box-shadow: 0 0 14px var(--blue-glow); }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); }
        .brand-sub { font-size: 0.75rem; color: var(--text-dim); }

        .auth-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .btn { background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-bright); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn:hover { border-color: var(--blue); }
        .btn-primary { background: #1f6feb; border-color: #388bfd; }
        .btn-primary:hover { background: #388bfd; }
        .user-tag { font-size: 0.8rem; font-family: var(--font-mono); color: var(--blue); padding: 0.3rem 0.6rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

        .onboard-box { background: linear-gradient(180deg, rgba(31, 111, 235, 0.08), rgba(0,0,0,0)); border: 1px dashed var(--blue); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
        .onboard-title { font-size: 0.85rem; font-weight: 600; color: var(--text-bright); margin-bottom: 0.4rem; }
        .code-row { display: flex; gap: 0.5rem; align-items: center; background: #05080c; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.8rem; font-family: var(--font-mono); font-size: 0.8rem; color: #79c0ff; overflow-x: auto; }
        .copy-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .copy-btn:hover { color: #fff; background: var(--border); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .section-header h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }

        .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 2rem; }
        @media (min-width: 800px) { .grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); } }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; position: relative; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.8rem; }
        .node-name { font-size: 1.1rem; font-weight: 600; color: var(--text-bright); }
        .node-meta { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); }

        .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; font-family: var(--font-mono); text-transform: uppercase; }
        .pill-online { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); }
        .pill-offline { background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.3); }
        .pill-warning { background: rgba(210, 153, 34, 0.15); color: #e3b341; border: 1px solid rgba(210, 153, 34, 0.3); }
        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .pill-online .pulse-dot { box-shadow: 0 0 6px #3fb950; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.8rem; }
        .metric-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.6rem; }
        .metric-label { font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
        .metric-val { font-size: 1.05rem; font-weight: 700; color: var(--text-bright); font-family: var(--font-mono); margin-top: 2px; }
        .metric-sub { font-size: 0.68rem; color: var(--text-dim); }

        .service-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .service-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; font-family: var(--font-mono); }
        .tag-run { color: #3fb950; font-weight: 600; }
        .tag-off { color: #f85149; font-weight: 600; }

        .sparkline { width: 100%; height: 26px; stroke: var(--blue); stroke-width: 1.5; fill: rgba(56, 139, 253, 0.08); }

        /* Modal styling */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 360px; padding: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal-title { font-size: 1.1rem; color: var(--text-bright); margin-bottom: 1rem; font-weight: 600; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.3rem; text-transform: uppercase; }
        .form-input { width: 100%; background: #05080c; border: 1px solid var(--border); color: #fff; padding: 0.5rem; border-radius: 6px; font-size: 0.85rem; }
        .form-input:focus { outline: none; border-color: var(--blue); }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }

        footer { text-align: center; font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div>
                <h1>NodePulse Cloud</h1>
                <div class="brand-sub">Distributed Fleet Telemetry & Incident Control</div>
            </div>
        </div>
        <div class="auth-bar" id="auth-bar">
            <!-- Rendered dynamically -->
        </div>
    </header>

    <div class="onboard-box" id="onboard-box">
        <div class="onboard-title">🚀 Подключить новый сервер за 5 секунд</div>
        <div class="code-row">
            <span id="install-cmd">curl -sSL https://pulse.nqai.es-cloud.ru/install.sh | sh</span>
            <button class="copy-btn" onclick="copyInstall()">Скопировать</button>
        </div>
    </div>

    <div class="section-header">
        <h2>Активный флот нод</h2>
        <span style="font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim);" id="sync-status">Синхронизация...</span>
    </div>

    <div class="grid" id="nodes-grid"></div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <div class="modal-title" id="modal-title">Вход в NodePulse</div>
            <div class="form-group">
                <label class="form-label">Логин</label>
                <input class="form-input" id="auth-username" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input class="form-input" type="password" id="auth-password" autocomplete="current-password">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" id="modal-submit" onclick="submitAuth()">Войти</button>
            </div>
        </div>
    </div>

    <footer>
        NodePulse Platform Engine v1.0.0 • Open Source Cloud Monitoring by NQAI
    </footer>

    <script>
        let currentAuth = JSON.parse(localStorage.getItem('np_auth') || 'null');
        let isRegisterMode = false;

        function updateAuthUI() {
            const bar = document.getElementById('auth-bar');
            const installCmd = document.getElementById('install-cmd');

            if (currentAuth) {
                bar.innerHTML = `
                    <span class="user-tag">👤 ${currentAuth.user.username}</span>
                    <button class="btn" onclick="logout()">Выйти</button>
                `;
                installCmd.innerText = `curl -sSL https://pulse.nqai.es-cloud.ru/install.sh?token=${currentAuth.token} | sh`;
            } else {
                bar.innerHTML = `
                    <button class="btn" onclick="openModal(false)">Войти</button>
                    <button class="btn btn-primary" onclick="openModal(true)">Создать аккаунт</button>
                `;
                installCmd.innerText = `curl -sSL https://pulse.nqai.es-cloud.ru/install.sh | sh`;
            }
        }

        function openModal(register) {
            isRegisterMode = register;
            document.getElementById('modal-title').innerText = register ? 'Создать аккаунт' : 'Вход в NodePulse';
            document.getElementById('modal-submit').innerText = register ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        async function submitAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) return alert('Заполните все поля');

            const endpoint = isRegisterMode ? '/api/v1/auth/register' : '/api/v1/auth/login';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка авторизации');
                currentAuth = data;
                localStorage.setItem('np_auth', JSON.stringify(data));
                closeModal();
                updateAuthUI();
                fetchNodes();
            } catch (err) {
                alert(err.message);
            }
        }

        function logout() {
            localStorage.removeItem('np_auth');
            currentAuth = null;
            updateAuthUI();
            fetchNodes();
        }

        function copyInstall() {
            const text = document.getElementById('install-cmd').innerText;
            navigator.clipboard.writeText(text);
            alert('Команда скопирована в буфер обмена!');
        }

        function renderSparkline(history, key) {
            if (!history || history.length < 2) return '';
            const values = history.map(h => h[key] || 0);
            const min = Math.min(...values);
            const max = Math.max(...values) || 1;
            const range = (max - min) || 1;
            const w = 140, h = 26;
            const step = w / (values.length - 1);
            const points = values.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / range) * (h - 4) - 2).toFixed(1)}`).join(' ');
            return `<svg class="sparkline" viewBox="0 0 ${w} ${h}"><polyline fill="none" points="${points}" /></svg>`;
        }

        async function fetchNodes() {
            try {
                const headers = {};
                if (currentAuth) {
                    headers['Authorization'] = 'Bearer ' + currentAuth.token;
                }
                const res = await fetch('/api/v1/nodes', {headers});
                const nodes = await res.json();
                renderNodes(nodes);
                document.getElementById('sync-status').innerText = 'Обновлено: ' + new Date().toLocaleTimeString();
            } catch (err) {
                console.error(err);
            }
        }

        function renderNodes(nodes) {
            const grid = document.getElementById('nodes-grid');
            grid.innerHTML = '';
            const entries = Object.entries(nodes);

            if (entries.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-dim); padding: 2rem; text-align: center; grid-column: 1 / -1; border: 1px dashed var(--border); border-radius: 8px;">У вас пока нет подключенных нод. Выполните команду выше на любом сервере!</div>';
                return;
            }

            for (const [id, node] of entries) {
                const latest = node.latest || {};
                const cpu = latest.cpu || {};
                const mem = latest.memory || {};
                const disk = (latest.disks && latest.disks[0]) || {};
                const services = latest.services || [];
                const history = node.history || [];

                const card = document.createElement('div');
                card.className = 'card';

                const servicesHtml = services.length > 0 ? services.slice(0, 6).map(s => `
                    <div class="service-item">
                        <span>📦 ${s.name}</span>
                        <span class="${s.active ? 'tag-run' : 'tag-off'}">${s.active ? 'RUNNING' : 'STOPPED'}</span>
                    </div>
                `).join('') : '<div style="font-size: 0.72rem; color: var(--text-dim);">Нет запущенных контейнеров</div>';

                card.innerHTML = `
                    <div class="card-top">
                        <div>
                            <div class="node-name">${id}</div>
                            <div class="node-meta">${node.info.hostname || id} • ${node.info.arch} • ${cpu.cores || 1} CPU</div>
                        </div>
                        <div class="status-pill pill-${node.status}">
                            <span class="pulse-dot"></span>
                            ${node.status}
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="metric-label">Load 1m</div>
                            <div class="metric-val">${(cpu.load_1 || 0).toFixed(2)}</div>
                            <div class="metric-sub">${(cpu.load_5 || 0).toFixed(2)} / ${(cpu.load_15 || 0).toFixed(2)}</div>
                            ${renderSparkline(history, 'load1')}
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">RAM ${(mem.used_pct || 0).toFixed(1)}%</div>
                            <div class="metric-val">${((mem.used_bytes || 0)/(1024**3)).toFixed(1)} GB</div>
                            <div class="metric-sub">из ${((mem.total_bytes || 0)/(1024**3)).toFixed(1)} GB</div>
                            ${renderSparkline(history, 'mem_pct')}
                        </div>
                    </div>

                    <div style="font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; margin: 0.8rem 0 0.4rem;">
                        Docker Контейнеры (${services.length})
                    </div>
                    <div class="service-list">
                        ${servicesHtml}
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        updateAuthUI();
        fetchNodes();
        setInterval(fetchNodes, 3000);
    </script>
</body>
</html>
