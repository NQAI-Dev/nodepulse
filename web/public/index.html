<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NodePulse Enterprise Fleet</title>
    <style>
        :root {
            --bg: #090d13;
            --surface: #111722;
            --surface-hover: #161f2e;
            --border: #212d3d;
            --text-dim: #7d8b99;
            --text: #c5d1de;
            --text-bright: #ffffff;
            --blue: #388bfd;
            --green: #238636;
            --red: #da3633;
            --orange: #d29922;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 1rem; min-height: 100vh; }
        
        header { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        @media (min-width: 600px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; padding: 1.5rem 0 1rem; }
            body { padding: 1.5rem 2rem; }
        }
        
        .logo-area { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon { width: 34px; height: 34px; min-width: 34px; background: linear-gradient(135deg, #1f6feb, #58a6ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; color: #fff; box-shadow: 0 0 12px rgba(56, 139, 253, 0.4); }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); letter-spacing: -0.5px; }
        
        .stats-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .badge { background: var(--surface); border: 1px solid var(--border); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); }
        .badge b { color: var(--text-bright); }
        .badge-red { border-color: rgba(218,54,51,0.4); background: rgba(218,54,51,0.1); color: #ff7b72; }

        /* Incidents Panel */
        .incidents-container { margin-bottom: 1.5rem; display: none; }
        .incident-card { background: rgba(218,54,51,0.08); border: 1px solid rgba(218,54,51,0.3); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .incident-title { font-weight: 600; color: #ff7b72; font-size: 0.85rem; }
        .incident-meta { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-mono); }
        .btn-resolve { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .btn-resolve:hover { background: var(--green); border-color: var(--green); color: #fff; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.25rem; }
        }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .node-name { font-weight: 700; font-size: 1.05rem; color: var(--text-bright); font-family: var(--font-mono); word-break: break-all; }
        .node-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        
        .status-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .pill-online { background: rgba(35, 134, 54, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .pill-offline { background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        .pulse-circle { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .metric-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; }
        .metric-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 0.25rem; display: flex; justify-content: space-between; }
        .metric-value { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); font-family: var(--font-mono); }
        .metric-sub { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); margin-top: 0.2rem; }

        .sparkline { width: 100%; height: 32px; margin-top: 0.5rem; }
        .sparkline path { fill: none; stroke-width: 2; stroke-linecap: round; }
        .sparkline-load { stroke: var(--blue); }
        .sparkline-mem { stroke: var(--orange); }

        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; margin-top: 0.25rem; display: flex; justify-content: space-between; }
        .service-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 180px; overflow-y: auto; padding-right: 0.25rem; }
        .service-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.03); }
        .service-name { font-family: var(--font-mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; display: flex; align-items: center; gap: 0.4rem; }
        .docker-badge { font-size: 0.65rem; background: rgba(56, 139, 253, 0.15); color: #58a6ff; padding: 1px 4px; border-radius: 4px; }
        .tag-active { color: #3fb950; font-weight: 600; font-size: 0.7rem; }
        .tag-down { color: #f85149; font-weight: 600; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>NodePulse Enterprise</h1>
                <div style="font-size: 0.75rem; color: var(--text-dim);">Fleet Infrastructure & Auto-healing Control Plane</div>
            </div>
        </div>
        <div class="stats-bar">
            <div class="badge" id="incidents-badge" style="display: none;"><span class="badge-red" style="padding: 2px 6px; border-radius: 4px;">Incidents: <b id="incidents-count">0</b></span></div>
            <div class="badge">Nodes: <b id="total-nodes">0</b></div>
            <div class="badge">Prometheus: <a href="/metrics" target="_blank" style="color: var(--blue); text-decoration: none;"><b>/metrics</b></a></div>
            <div class="badge">Sync: <b id="live-time">--:--:--</b></div>
        </div>
    </header>

    <div class="incidents-container" id="incidents-panel">
        <div class="section-title" style="margin-bottom: 0.5rem; color: #ff7b72;">
            <span>Active Incidents & Outages</span>
        </div>
        <div id="incidents-list"></div>
    </div>

    <div class="grid" id="nodes-grid">
        <div style="color: var(--text-dim); font-size: 0.85rem;">Connecting to NodePulse telemetry engine...</div>
    </div>

    <script>
        const grid = document.getElementById('nodes-grid');
        const incidentsPanel = document.getElementById('incidents-panel');
        const incidentsList = document.getElementById('incidents-list');
        const incidentsBadge = document.getElementById('incidents-badge');
        const incidentsCount = document.getElementById('incidents-count');

        function renderSparkline(history, key) {
            if (!history || history.length < 2) return '';
            const values = history.map(h => h[key] || 0);
            const min = Math.min(...values);
            const max = Math.max(...values, min + 0.01);
            const w = 140, h = 32;
            const points = values.map((v, i) => {
                const x = (i / (values.length - 1)) * w;
                const y = h - ((v - min) / (max - min)) * (h - 6) - 3;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');

            const cssClass = key === 'load1' ? 'sparkline-load' : 'sparkline-mem';
            return `
                <svg class="sparkline" viewBox="0 0 ${w} ${h}">
                    <polyline points="${points}" class="${cssClass}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
        }

        async function resolveIncident(id) {
            try {
                await fetch(`/api/v1/incidents/resolve?id=${id}`, { method: 'POST' });
                fetchIncidents();
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchIncidents() {
            try {
                const res = await fetch('/api/v1/incidents');
                if (!res.ok) return;
                const incidents = await res.json() || [];
                if (incidents.length > 0) {
                    incidentsBadge.style.display = 'block';
                    incidentsCount.innerText = incidents.length;
                    incidentsPanel.style.display = 'block';
                    incidentsList.innerHTML = incidents.map(inc => `
                        <div class="incident-card">
                            <div>
                                <div class="incident-title">🚨 ${inc.title}</div>
                                <div class="incident-meta">${inc.node_id} • ${inc.detail || ''} • ${new Date(inc.started_at * 1000).toLocaleTimeString()}</div>
                            </div>
                            <button class="btn-resolve" onclick="resolveIncident('${inc.id}')">Resolve</button>
                        </div>
                    `).join('');
                } else {
                    incidentsBadge.style.display = 'none';
                    incidentsPanel.style.display = 'none';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchNodes() {
            try {
                const res = await fetch('/api/v1/nodes');
                if (!res.ok) return;
                const data = await res.json();
                renderNodes(data);
                fetchIncidents();
            } catch (e) {
                console.error("Telemetry fetch error:", e);
            }
        }

        function renderNodes(nodes) {
            const nodeEntries = Object.entries(nodes);
            document.getElementById('total-nodes').innerText = nodeEntries.length;
            document.getElementById('live-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

            grid.innerHTML = '';
            for (const [id, node] of nodeEntries) {
                const latest = node.latest || {};
                const cpu = latest.cpu || {};
                const mem = latest.memory || {};
                const services = latest.services || [];
                const history = node.history || [];

                const card = document.createElement('div');
                card.className = 'card';

                let servicesHtml = '<div style="font-size: 0.72rem; color: #6e7681;">No active service probes</div>';
                if (services.length > 0) {
                    servicesHtml = services.slice(0, 10).map(s => `
                        <div class="service-item">
                            <span class="service-name">
                                <span class="docker-badge">${s.type}</span>
                                ${s.name}
                            </span>
                            <span class="${s.active ? 'tag-active' : 'tag-down'}">
                                ${s.active ? '● RUN' : '■ OFF'}
                            </span>
                        </div>
                    `).join('');
                }

                card.innerHTML = `
                    <div class="card-top">
                        <div style="min-width: 0; flex: 1;">
                            <div class="node-name">${id}</div>
                            <div class="node-meta">${node.info.hostname || id} • ${node.info.arch} • ${cpu.cores || 1} CPU</div>
                        </div>
                        <div class="status-pill pill-${node.status}">
                            <span class="pulse-circle"></span>
                            ${node.status}
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="metric-label">
                                <span>Load Avg</span>
                                <span style="color: var(--blue)">1m/5m</span>
                            </div>
                            <div class="metric-value">${(cpu.load_1 || 0).toFixed(2)}</div>
                            <div class="metric-sub">${(cpu.load_5 || 0).toFixed(2)} / ${(cpu.load_15 || 0).toFixed(2)}</div>
                            ${renderSparkline(history, 'load1')}
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">
                                <span>RAM</span>
                                <span>${(mem.used_pct || 0).toFixed(1)}%</span>
                            </div>
                            <div class="metric-value">${((mem.used_bytes || 0) / (1024**3)).toFixed(1)} GB</div>
                            <div class="metric-sub">of ${((mem.total_bytes || 0) / (1024**3)).toFixed(1)} GB</div>
                            ${renderSparkline(history, 'mem_pct')}
                        </div>
                    </div>

                    <div class="section-title">
                        <span>Containers (${services.length})</span>
                        <span>Docker</span>
                    </div>
                    <div class="service-list">
                        ${servicesHtml}
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        fetchNodes();
        setInterval(fetchNodes, 3000);
    </script>
</body>
</html>
