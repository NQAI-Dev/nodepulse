version: "2"
linters:
  default: standard
  disable:
    - errcheck
    - gocritic
    - gocyclo
    - gosec
    - staticcheck
    - stylecheck
    - unused
    - unparam
    - ineffassign
    - misspell
    - prealloc
    - dupword
    - forbidigo
    - exhaustive
    - exhaustruct
    - nilnil
    - godot
    - wsl
    - gocheckcompilerdirectives
    - varnamelen
    - nolintlint
    - mnd
    - cyclop
    - funlen
    - gosimple
    - nestif
    - paralleltest
    - tparallel
    - testpackage
    - thelper
    - nlreturn
    - containedctx
    - contextcheck
    - errname
    - errorlint
    - errorf
    - gocognit
    - goconst
    - gosmopolitan
    - grouper
    - importas
    - iface
    - perfsprint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - zerologlint
    - sloglint
    - usestdlibvars
    - fatcontext
    - copyloopvar
    - spancheck
    - looppointer
    - protogetter
    - reassign
    - durationcheck
    - exportloopref
  enable:
    - govet
    - ineffassign
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: \.go
        text: "QF1008"
        linters:
          - staticcheck
run:
  timeout: 5m
